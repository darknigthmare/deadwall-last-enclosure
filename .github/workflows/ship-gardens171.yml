name: DEADWALL reviewed garden integration
on:
  push:
    branches: ['feat/codex3000-detailed-programmes-159']
    paths: ['.github/ship171/**', '.github/workflows/ship-gardens171.yml']
permissions:
  contents: write
concurrency:
  group: reviewed-gardens171
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'darknigthmare/deadwall-last-enclosure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply the exact reviewed source delta, never a moving branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor b8a8e3338465b8c02ec6316d29fa25793f49a129 HEAD
          python3 .github/ship171/apply.py
      - name: Build with locked development tools
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          node scripts/check-syntax134.mjs
          npm run build
      - name: Garden, source, save, migration and distribution regressions
        run: |
          set -o pipefail
          node --test --test-concurrency=1 tests/codex-gardens171*.test.cjs tests/codex-coverage*.test.cjs tests/g8-migration157.test.cjs tests/recipe-activation159.test.cjs tests/codex-stations170.test.cjs tests/distribution.test.cjs | tee artifacts/qa/ship171/contracts.log
      - name: Actual browser activation, saved revision and Continue
        run: |
          npx playwright install --with-deps chromium
          node scripts/browser-gardens171.mjs
          node scripts/render-gardens171.mjs
      - name: Inspect all compatible source recipes and retain old budgets
        run: node scripts/audit-gardens171.mjs
      - name: Publish only verified source paths on this unchanged PR branch
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          m=json.load(open('artifacts/qa/ship171/applied.json'))
          for r in m['files']:
              if hashlib.sha256(pathlib.Path(r['path']).read_bytes()).hexdigest()!=r['after']:
                  raise ValueError('Source changed during verification: '+r['path'])
          names=[r['path'] for r in m['files']]
          tracked=subprocess.check_output(['git','ls-files','src/codex3000-live-data.js']).strip()
          if tracked:names.append('src/codex3000-live-data.js')
          dirty=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          if set(dirty)-set(names):raise ValueError('Unexpected tracked changes')
          subprocess.run(['git','add','--',*names],check=True)
          PY
          git config user.name 'DEADWALL validation'
          git config user.email 'validation@users.noreply.github.com'
          git commit -m 'feat(codex): compose attributed gardens with preserved paths and possessions'
          branch='feat/codex3000-detailed-programmes-159'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > artifacts/qa/ship171/published.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadwall-gardens171-integration
          path: artifacts/qa/
          retention-days: 14
          if-no-files-found: error
