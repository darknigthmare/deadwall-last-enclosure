name: DEADWALL metric scale and frontage
on:
  push:
    branches: [fix/metric-scale-road-access-174, fix/metric174-scale-frontage]
  pull_request:
    paths:
      - 'src/*174.js'
      - 'src/frontier*'
      - 'src/*vehicle*'
      - 'src/expedition*'
      - 'src/core.js'
      - 'src/assets136.js'
      - 'src/atlas-render.js'
      - 'src/field-atlas.js'
      - 'src/region-roadkit.js'
      - 'src/return-routes.js'
      - 'src/world-variants158.js'
      - 'src/world-pack131.js'
      - 'scripts/*174*'
      - 'scripts/metric-compat185.cjs'
      - 'tests/*174*'
      - '.github/workflows/metric174.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metric174-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - name: Record tested source and tree
        run: |
          mkdir -p artifacts/qa/metric174
          git rev-parse HEAD > artifacts/qa/metric174/tested-revision.txt
          git rev-parse HEAD:src > artifacts/qa/metric174/tested-src-tree.txt
      - name: Exact source, geometry, migration and distribution contracts
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=2 tests/metric174.test.cjs tests/frontage174.test.cjs tests/metric-migration174.test.cjs tests/expeditions.test.cjs tests/vehicle-boundary151.test.cjs tests/vehicle-art152.test.cjs tests/world-variants158.test.cjs tests/road-network129.test.cjs tests/driveway-surface144.test.cjs tests/distribution.test.cjs | tee artifacts/qa/metric174/contracts.log
      - name: Inventory every programme and compare historical world ownership
        run: |
          mkdir -p /tmp/deadwall-metric174-base /tmp/deadwall-metric174-current
          git archive 5b8f0ade7f7e93d3fc3ea23f762cac93ded43d90 src | tar -x -C /tmp/deadwall-metric174-base
          git archive 1314e2c1d67f23c05cdd4bd53943fe97c6f56d9a src | tar -x -C /tmp/deadwall-metric174-current
          node scripts/audit-metric174.mjs --baseline /tmp/deadwall-metric174-base --strict-baseline /tmp/deadwall-metric174-current --legacy-visual-additions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadwall-metric174-audit
          path: artifacts/qa/metric174/
          retention-days: 14
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build && npx playwright install --with-deps chromium
      - name: Record tested source and tree
        run: |
          mkdir -p artifacts/qa/metric174-browser-provenance
          git rev-parse HEAD > artifacts/qa/metric174-browser-provenance/tested-revision.txt
          git rev-parse HEAD:src > artifacts/qa/metric174-browser-provenance/tested-src-tree.txt
      - run: node scripts/browser-metric174.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadwall-metric174-browser
          path: artifacts/qa/metric174-browser-*
          retention-days: 14
          if-no-files-found: error
