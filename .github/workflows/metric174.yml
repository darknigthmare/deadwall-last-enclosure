name: DEADWALL metric scale and frontage
on:
  push:
    branches: [fix/metric174-scale-frontage]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metric174-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact tracked source inputs
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, stat, subprocess, zipfile
          root = pathlib.Path.cwd()
          out = root / 'artifacts' / 'metric174-source'
          out.mkdir(parents=True, exist_ok=True)
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          allowed = {'src', 'tests', 'scripts', 'assets', 'docs', 'desktop', 'codex-3000', '.github'}
          records = []
          with zipfile.ZipFile(out / 'source.zip', 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=4) as archive:
              for name in sorted(filter(None, names)):
                  p = pathlib.PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise ValueError('Unsafe tracked path')
                  if len(p.parts) > 1 and p.parts[0] not in allowed and name != 'reports/1.35.0/legacy-g5-start-save.json':
                      continue
                  if any(part.startswith('.env') for part in p.parts) or p.suffix.lower() in {'.pem', '.key', '.p12', '.ttf', '.otf', '.woff', '.woff2'}:
                      continue
                  file = root / name
                  if not stat.S_ISREG(file.lstat().st_mode):
                      continue
                  data = file.read_bytes()
                  archive.writestr(name, data)
                  records.append({'path': name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
              archive.writestr('SOURCE-MANIFEST174.json', json.dumps({'revision': revision, 'files': records}, indent=2))
          print(json.dumps({'revision': revision, 'files': len(records)}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deadwall-metric174-source
          path: artifacts/metric174-source/
          retention-days: 7
          if-no-files-found: error
