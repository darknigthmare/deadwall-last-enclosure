name: Audit regressions

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: audit-regressions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      DEADWALL_QA_ROOT: ${{ github.workspace }}/dist
      VERTICAL175_QA_OUT: ${{ github.workspace }}/artifacts/qa/audit183-vertical
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/audit183-manifest.test.cjs tests/audit183-render.test.cjs tests/audit183-ui.test.cjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Native new game, save and responsive HUD from dist
        run: node scripts/browser-audit183.mjs
      - name: Citadel FPS, input ownership and geometry cache from dist
        run: node scripts/qa-vertical175.mjs
      - name: Retain exact build identity and test evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/qa
          git rev-parse HEAD > artifacts/qa/audit183-commit.txt
          if [ -f dist/index.html ]; then sha256sum dist/index.html dist/src/vertical-citadel175-render.js dist/src/codex3000-live-data.js > artifacts/qa/audit183-build.sha256; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit183-proof-${{ github.run_attempt }}
          path: artifacts/qa/
          retention-days: 14
          if-no-files-found: error
