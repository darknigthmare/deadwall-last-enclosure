name: Verify menu lifecycle patch 195
on:
  push:
    branches: [audit/menu195-source-20261019]
    paths: [.github/workflows/menu195-stage.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 76450f62348688689d219eb89a3b248b7fe5ca41
          persist-credentials: false
      - name: Check exact before and after bytes; do not change any ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,os,urllib.request,subprocess
          assert os.environ['GITHUB_REPOSITORY']=='darknigthmare/deadwall-last-enclosure'
          assert os.environ['GITHUB_REF']=='refs/heads/audit/menu195-source-20261019'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='76450f62348688689d219eb89a3b248b7fe5ca41'
          rows=json.loads(r'''[{"path":"src/player-menus194.js","before":"6353703044e76a4f0a0c87b609b2617c136df3f3","after":"9df6ebe3d5e41616c0237fe1301123049c1bff17","edits":[[1222,1800," const ROUTES={expansions:['terrain','field-expansions'],operations:['terrain','field-operations'],recon:['terrain','reconPanel'],sectors:['terrain','field-sectors'],coordination:['city','coordinationPanel'],crew:['city','field-crew'],logistics:['city','field-logistics'],territories:['city','field-territories'],siege:['city','field-siege'],dayworks:['city','dayworksPanel'],citadel:['city','citadelPanel'],infrastructure:['city','infrastructurePanel'],linecare:['city','linecarePanel'],infected:['reference','field-infected'],world125:['reference','field-world125'],'world-codex':['reference','field-world-codex']};\n"]]},{"path":"player-menus194.css","before":"a4afb6ad49d0d696ec12ba3d3ff2441251982e10","after":"f1646e642f881b2730aceff37be2ad9652528a32","edits":[[9558,9558,"\n/* The notebook already identifies the place and pause in its fixed frame. */\n.player-menus194 #commandModal .expansion-heading{padding:8px 12px;display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px}\n.player-menus194 #commandModal .expansion-heading>small,.player-menus194 #commandModal .expansion-context{display:none}\n.player-menus194 #commandModal .expansion-heading h2{font-size:19px;margin:0}\n.player-menus194 #commandModal .expansion-onboarding{margin:0}\n\n/* The old Guide used pale text for a dark panel; the notebook is paper. */\n.player-menus194 #commandModal .command-body .world-codex{color:#29352f}\n.player-menus194 #commandModal .world-codex-controls label{color:#344734}\n@media(max-height:500px){\n .player-menus194 #commandModal .command-heading{min-height:0;height:auto;padding:8px 62px 8px 18px}\n .player-menus194 #commandModal .command-heading>small{display:none}\n .player-menus194 #commandModal #commandTitle{font-size:20px;margin:0;line-height:1.2}\n .player-menus194 #commandModal .notebook-domains194{margin-bottom:8px}\n .player-menus194 #commandModal .field-nav{margin-bottom:10px}\n}\n"]]},{"path":"scripts/browser-player-menus194.mjs","before":"12408e567a945b238faf1df1c663ae32c72a3aad","after":"26558be3c578dbe7ca42a7a7fbcb8e0d4b0fe7ed","edits":[[4705,5109,"   await click('#pauseButton');await click('#pauseCommandButton');await page.locator('#commandModal').waitFor({state:'visible'});let before=await snapshot(page);\n   check('Notebook begins with the actual next gameplay objective',await page.evaluate(()=>document.getElementById('playerObjective194').isConnected&&document.getElementById('playerObjective194').parentNode.id==='commandPanel-enclosure'&&document.getElementById('playerObjectiveTitle194').textContent===DEADWALL.ui.objectiveTitle.textContent&&!!DEADWALL.ui.objectiveTitle.textContent));\n"],[5418,5683,"   await click('#commandTab-field');check('Field opens exactly one dossier',JSON.stringify(await panels(page))===JSON.stringify(['field-expansions']));check('Local D-17 reference is not mixed into terrain orders',!await page.locator('.field-nav [data-field-view=\"world125\"]').isVisible());\n   await click('#expansionGroup-world');\n   await click('#expansionTab-world131');\n"],[6755,6858,"   await click('#notebookDomain-reference');await click('.field-nav [data-field-view=\"world125\"]');check('D-17 reference opens one native dossier',JSON.stringify(await panels(page))===JSON.stringify(['field-world125']));await click('.field-nav [data-field-view=\"world-codex\"]');\n"],[7714,7714,"   const guideContrast=await page.locator('.world-codex-controls label').evaluateAll(ns=>{\n    const luminance=s=>{const rgb=s.match(/[\\d.]+/g).slice(0,3).map(Number).map(x=>{x/=255;return x<=.04045?x/12.92:((x+.055)/1.055)**2.4;});return rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722;};\n    return ns.map(n=>{const fg=getComputedStyle(n).color,bg=getComputedStyle(document.querySelector('.command-body')).backgroundColor,a=luminance(fg),b=luminance(bg);return{fg,bg,ratio:(Math.max(a,b)+.05)/(Math.min(a,b)+.05)};});\n   });profile.guideContrast=guideContrast;check('Guide filter labels remain readable on the notebook paper',guideContrast.length>0&&guideContrast.every(c=>c.ratio>=4.5));\n"],[7810,7810,"   const afterReading=await snapshot(page);if(afterReading!==before)await writeFile(path.join(output,viewport.name+'-reading-difference.json'),JSON.stringify({before:JSON.parse(before),after:JSON.parse(afterReading)},null,2));check('Reading dossiers preserves every saved owner before issuing an order',afterReading===before);\n"],[8132,8252,"   // Worker commands deliberately clear their previous task/navigation; returning\n   // the general order is not an undo. Subsequent read-only checks must compare\n   // against that genuinely commanded state, not erase it from the saved data.\n   const afterOrder=await snapshot(page),prior=JSON.parse(before),next=JSON.parse(afterOrder);\n   check('Native worker orders preserve resources and campaign identity',JSON.stringify(prior.resources)===JSON.stringify(next.resources)&&prior.worldSeed===next.worldSeed&&prior.runId===next.runId);\n   profile.workerOrder={from:oldOrder,to:'harvest',restored:oldOrder,taskStateChanged:afterOrder!==before};before=afterOrder;\n"]]}]''')
          def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          receipt=[]
          for row in rows:
              p=pathlib.Path(row['path']);assert not p.is_absolute() and '..' not in p.parts
              b=p.read_bytes();assert blob(b)==row['before'],str(p)
              for start,end,text in reversed(row['edits']):
                  assert 0<=start<=end<=len(b)
                  b=b[:start]+text.encode()+b[end:]
              assert blob(b)==row['after'],str(p)
              request=urllib.request.Request('https://api.github.com/repos/darknigthmare/deadwall-last-enclosure/git/blobs',data=json.dumps({'content':b.decode(),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as r:created=json.load(r)
              assert created['sha']==row['after']
              receipt.append({'path':str(p),'sha':created['sha']})
          out=pathlib.Path('/tmp/menu195-patch');out.mkdir();(out/'receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: menu195-patch-objects
          path: /tmp/menu195-patch/
          retention-days: 3
