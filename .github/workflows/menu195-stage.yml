name: Verify menu lifecycle patch 195
on:
  push:
    branches: [audit/menu195-source-20261019]
    paths: [.github/workflows/menu195-stage.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3c4b0fee6e0551254c26bc1b893b8a86b41ac173
          persist-credentials: false
      - name: Check exact before and after bytes; do not change any ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,os,urllib.request,subprocess
          assert os.environ['GITHUB_REPOSITORY']=='darknigthmare/deadwall-last-enclosure'
          assert os.environ['GITHUB_REF']=='refs/heads/audit/menu195-source-20261019'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='3c4b0fee6e0551254c26bc1b893b8a86b41ac173'
          rows=json.loads(r'''[{"path":".github/workflows/player-menus194.yml","before":"1897422aab45709cbcbd7bf034c5a2239ece8995","after":"60b957dfce81b1f5016572e6f8779b49cb9239ba","edits":[[870,1093,"          node --test --test-concurrency=2 tests/player-menus194.test.cjs tests/player-menus195.test.cjs tests/audit183-manifest.test.cjs tests/distribution.test.cjs tests/import-concurrency.test.cjs 2>&1 | tee artifacts/qa/player-menus194/contracts.log\n"]]},{"path":"player-menus194.css","before":"a4afb6ad49d0d696ec12ba3d3ff2441251982e10","after":"3ee10d39111dab606eb35fcd404ad135497bc587","edits":[[9558,9558,"\n/* The notebook already identifies the place and pause in its fixed frame. */\n.player-menus194 #commandModal .expansion-heading{padding:8px 12px;display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px}\n.player-menus194 #commandModal .expansion-heading>small,.player-menus194 #commandModal .expansion-context{display:none}\n.player-menus194 #commandModal .expansion-heading h2{font-size:19px;margin:0}\n.player-menus194 #commandModal .expansion-onboarding{margin:0}\n"]]},{"path":"scripts/browser-player-menus194.mjs","before":"8e14499d92013ba1f863ebc85e653aaa2c68ff6f","after":"7c28a1aa8621d58f0a092a27f89ea6f978fb1418","edits":[[4869,5109,"   check('Notebook begins with the actual next gameplay objective',await page.evaluate(()=>document.getElementById('playerObjective194').isConnected&&document.getElementById('playerObjective194').parentNode.id==='commandPanel-enclosure'&&document.getElementById('playerObjectiveTitle194').textContent===DEADWALL.ui.objectiveTitle.textContent&&!!DEADWALL.ui.objectiveTitle.textContent));\n"],[5570,5626,"   await click('#expansionGroup-world');\n   // The group opens its first live dossier (currently Weather). Choose the\n   // actual relay dossier before inspecting its migration/player action split.\n   await click('#expansionTab-world131');\n"]]},{"path":"scripts/qa-startup134.cjs","before":"8a8cf05bbc96769fc2533d5d528bd9e8c2025a94","after":"4f7fe5f8a02cdd5598ad991e5f9fbe2a0656583f","edits":[[256,411,"function bootDocument134({search=''}={}){\nconst env=require('../tests/helpers/browser.cjs').installFakeBrowser({readyState:'loading',currentScript:{tagName:'SCRIPT'},search});\n"]]},{"path":"src/world-codex.js","before":"e2a43b016b315b8d9019084fcaec503fab81a5c2","after":"c17b075a6037e07cf5c53c8a29b0b6c2e1852a62","edits":[[6486,6486,"    const readableCount=playerGuide?entries.filter(e=>['jouable','pilote'].includes(e.status)).length:entries.length;\n"],[14544,15132,"    function refresh(reset=true){if(reset!==false)visible=36;const found=query({text:search.value,family:family.value,status:status.value,availability:availability.value},game).filter(e=>!playerGuide||['jouable','pilote'].includes(e.status));list.replaceChildren();liveNodes.clear();lastSignature='';count.textContent=found.length+' fiche'+(found.length===1?'':'s')+' trouvée(s) · '+readableCount+(playerGuide?' dans votre guide':' dans le guide');\n      if(!found.length){list.appendChild(el('p',playerGuide?'Aucune fiche pour ces filtres. Essayez un terme plus court, « Toutes les familles » et « Tous les usages ».':'Aucune fiche pour ces filtres. Essayez un terme plus court ou « Présent et projets ».','world-codex-empty'));return;}\n"]]},{"path":"tests/codex-actions159.test.cjs","before":"0fdb3ad7151c082887a403f1f71801bd5c49c4e4","after":"22653973921d6e2fb9ef92c3d8c3e37e78058075","edits":[[16144,16554,"test('Author dossier: Guide live diagnostics update readable limits without replacing focused native controls',()=>{\n const {g,doc}=bootDocument134({search:'?tools=1&fixture=legacy'});g.startNew('standard','17117');g.campaignIntro132.skip();g.worldCodex.open();const use=doc.getElementById('worldCodexAvailability159'),search=doc.getElementById('worldCodexSearch');use.value='city';use.dispatch('change');search.value='counterweight';search.dispatch('input');\n"],[17472,17720,"test('Author dossier: The shipped G10 card button is keyboard-focusable and requests controller navigation without activation or notebook changes',()=>{\n const {g,doc}=bootDocument134({search:'?tools=1&fixture=legacy'});g.startNew('standard','17117');g.campaignIntro132.skip();g.worldCodex.open();\n"],[19438,19746,"test('Author dossier: Shipped regional guide uses the real atlas and saved waypoint without touching unknown sites or resources',()=>{\n const {g,doc}=bootDocument134({search:'?tools=1&fixture=legacy'});g.startNew('standard','17117');g.campaignIntro132.skip();const world=g.frontier.world(),place=world.pois.find(p=>p.programme3000),code=place.programme3000;\n"]]},{"path":"tests/g8-migration157.test.cjs","before":"92dc559ab0cac36013e0d253720dee13b8a99f02","after":"48d5ba20c1f9f1dae45a6957f7af7a5ba34c63b1","edits":[[10135,10208," // The shared G7 fixture deliberately removes detail flags for legacy tests.\n // Select the detail-rich historical input explicitly before checking the\n // missing-flag migration; preserve the same collision and movement assertions.\n const g=campaign(),detailed=g.serialize();detailed.frontier.detailVersion=1;\n assert.equal(g.restoreSave(detailed),true);assert.equal(g.frontier.snapshot().detailVersion,1);\n"]]}]''')
          def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          receipt=[]
          for row in rows:
              p=pathlib.Path(row['path']);assert not p.is_absolute() and '..' not in p.parts
              b=p.read_bytes();assert blob(b)==row['before'],str(p)
              for start,end,text in reversed(row['edits']):
                  assert 0<=start<=end<=len(b)
                  b=b[:start]+text.encode()+b[end:]
              assert blob(b)==row['after'],str(p)
              request=urllib.request.Request('https://api.github.com/repos/darknigthmare/deadwall-last-enclosure/git/blobs',data=json.dumps({'content':b.decode(),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as r:created=json.load(r)
              assert created['sha']==row['after']
              receipt.append({'path':str(p),'sha':created['sha']})
          out=pathlib.Path('/tmp/menu195-patch');out.mkdir();(out/'receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: menu195-patch-objects
          path: /tmp/menu195-patch/
          retention-days: 3
