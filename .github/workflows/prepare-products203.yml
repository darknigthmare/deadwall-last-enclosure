name: Verify immutable products203 source objects
on:
  push:
    branches: [feat/field-products-203]
    paths: [.github/workflows/prepare-products203.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify source deltas and create unreferenced objects only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request,zlib
          assert os.environ['GITHUB_REPOSITORY']=='darknigthmare/deadwall-last-enclosure'
          assert os.environ['GITHUB_REF']=='refs/heads/feat/field-products-203'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def api(path,data=None):
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
              body=None if data is None else json.dumps(data).encode()
              if body is not None:headers['Content-Type']='application/json'
              req=urllib.request.Request('https://api.github.com/repos/darknigthmare/deadwall-last-enclosure'+path,data=body,headers=headers,method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
          out=pathlib.Path('artifacts/source203');out.mkdir(parents=True,exist_ok=True)
          parts=[]
          for i,sha in enumerate(['400e5b5e9deca307dae497e6f64e667b964ea6a3','e930b1428b3264967b033c07652ffd8c1ef49f4c','85070ca82bee1e580edaccdd0f77df7ff0ffbce9']):
              row=api('/git/blobs/'+sha);assert row['encoding']=='base64'
              b=base64.b64decode(row['content']);assert blob(b)==sha
              (out/('received-'+str(i)+'.txt')).write_bytes(b)
              # Correct transfer transcription only; source acceptance below is
              # still guarded by complete chunk, aggregate and final-tree hashes.
              corrections=[[(b'HvumuzNh',b'HvumzNh'),(b'iluHluHKOJJ+g3NYhNYh4Le2v',b'iluHKOJJ+g3NYh4Le2v')],[(b'Q/s2BqzhyUeU0',b'Q/s2BqzhyU0')],[]][i]
              for old,new in corrections:
                  assert b.count(old)==1;b=b.replace(old,new)
              (out/('normalized-'+str(i)+'.txt')).write_bytes(b)
              assert blob(b)==['eb49aeb9da1a4b9b6dd0a204f1ac6e74991f7b40','5311f9be1dfe26f0b031cb20787d16406ba89996','85070ca82bee1e580edaccdd0f77df7ff0ffbce9'][i]
              parts.append(b)
          encoded=b''.join(parts);assert len(encoded)==37108
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='3c85633947197519f4d66e926dcc4e8b80a56ab8df5213c9af91bb7c708538ef'
          rows=json.loads(raw)
          allowed={'docs/LIFECYCLE_202.md','docs/PRODUCT_TRANSPORT_203.md','scripts/browser-lifecycle202.mjs','scripts/browser-products203.mjs','src/campaign-pack.js','src/coop.js','src/essential-ops.js','src/expansion-kit.js','src/exploration-pack.js','src/frontier.js','src/husbandry191-art.js','src/husbandry191.js','src/succession133.js','src/vertical-network179.js','src/wildlife-harvest190.js','tests/continuation202-coop-lifecycle.test.cjs','tests/continuation202-field-lifecycle.test.cjs','tests/products203-native.test.cjs','tests/products203.test.cjs'}
          assert len(rows)==len(allowed) and {r['path']for r in rows}==allowed
          elements=[]
          for row in rows:
              p=pathlib.Path(row['path']);assert not p.is_symlink()
              if row['before'] is None:assert not p.exists();old=b''
              else:old=p.read_bytes();assert blob(old)==row['before']
              data=old;last=len(old)+1
              for start,end,text in reversed(row['edits']):
                  assert 0<=start<=end<=len(old) and end<last;last=start
                  data=data[:start]+text.encode()+data[end:]
              assert blob(data)==row['after'];p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              if p.suffix in ('.js','.mjs','.cjs'):subprocess.run(['node','--check',str(p)],check=True)
              created=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()});assert created['sha']==row['after']
              elements.append({'path':row['path'],'mode':'100644','type':'blob','sha':created['sha']})
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          helper='.github/workflows/prepare-products203.yml'
          subprocess.run(['git','rm','--cached',helper],check=True)
          expected='52ab3639c3859e35d2ce3f880e9784c8167e55e0'
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==expected
          subprocess.run(['git','add',helper],check=True)
          candidate=subprocess.check_output(['git','write-tree'],text=True).strip()
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          tree=api('/git/trees',{'base_tree':base,'tree':elements});assert tree['sha']==candidate
          receipt={'base':'6c6fbb6cf563bea6c89ade99c65f18c438481532','bootstrap':os.environ['GITHUB_SHA'],'treeWithHelper':tree['sha'],'expectedFinalTree':expected,'files':elements,'scope':'Verified source objects only. No ref update, merge, deployment or gameplay qualification.'}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: products203-source-receipt
          path: artifacts/source203/
          retention-days: 3
          if-no-files-found: error
