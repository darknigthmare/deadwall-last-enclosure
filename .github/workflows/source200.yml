name: Verify exact care200 source objects
on:
  push:
    branches: [codex/verify-source200-20261020]
    paths: [.github/workflows/source200.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 70491e9a9defbc6334d304990353a5ed68d663d2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate byte identities and create unreferenced blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request,zlib
          assert os.environ['GITHUB_REPOSITORY']=='darknigthmare/deadwall-last-enclosure'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/verify-source200-20261020'
          base='70491e9a9defbc6334d304990353a5ed68d663d2'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==base
          def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def api(path,data=None):
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
              body=None if data is None else json.dumps(data).encode()
              if body is not None:headers['Content-Type']='application/json'
              req=urllib.request.Request('https://api.github.com/repos/darknigthmare/deadwall-last-enclosure'+path,data=body,headers=headers,method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req,timeout=45) as response:return json.load(response)
          def get(sha):
              r=api('/git/blobs/'+sha);assert r['encoding']=='base64'
              b=base64.b64decode(r['content']);assert blob(b)==sha;return b
          part=get('6f97aea4cc4b5e0c3cf8ae983cb670ad5f220be0')
          # Correct four transcription errors in the transport only. The exact
          # compressed payload, decoded JSON and every resulting source are hashed.
          for old,new in [(b'XpZJp4RT',b'XpZJ4RT'),(b'YS8I/iXY',b'YS8I/XY'),(b'WPfeLJ79',b'WPfeL79'),(b'LikPNsU0r',b'LikPNsL0r')]:
              assert part.count(old)==1;part=part.replace(old,new)
          assert blob(part)=='1c5beee0aaf7b709a30410d4f2bcfbe5cd719818',blob(part)
          packed=part+b''.join(get(sha)for sha in ['3d9bfddad77df6674a90aa8c4df58fd93b123ffd','4f8469cfdb697fcb394e25bfe72c9a38e0ba6436','be6779e73ffaa35dc591d89546f41adab55092a1'])
          assert len(packed)==28144
          raw=zlib.decompress(base64.b64decode(packed,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='9226038ee95265d7368ab39ca176cc07e43169a8bd7ed8a6977271c3157c1b37'
          rows=json.loads(raw)
          allowed={'.github/workflows/undercovered200.yml','docs/UNDERCOVERED_SYSTEMS_200.md','scripts/browser-care200.mjs','scripts/coop-server.mjs','src/coop.js','src/core.js','src/frontier.js','src/game.js','src/husbandry191-art.js','src/husbandry191.js','src/world-evolution-ui.js','tests/undercovered200-art.test.cjs','tests/undercovered200-care.test.cjs','tests/undercovered200-coop.test.cjs','tests/undercovered200-input.test.cjs','tests/undercovered200-native.test.cjs','tests/undercovered200-relay.test.cjs'}
          assert len(rows)==len(allowed) and {r['path']for r in rows}==allowed
          elements=[]
          for row in rows:
              p=pathlib.Path(row['path']);assert not p.is_symlink()
              if row['before'] is None:assert not p.exists();old=b''
              else:old=p.read_bytes();assert blob(old)==row['before']
              data=old;last=len(old)+1
              for start,end,text in reversed(row['edits']):
                  assert 0<=start<=end<=len(old) and end<last;last=start
                  data=data[:start]+text.encode()+data[end:]
              assert blob(data)==row['after'];p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              if p.suffix in ('.js','.cjs','.mjs'):subprocess.run(['node','--check',str(p)],check=True)
              r=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()});assert r['sha']==row['after']
              elements.append({'path':row['path'],'mode':'100644','type':'blob','sha':r['sha']})
          reused={'.github/workflows/undercovered199.yml':'d24e48b67f5c91717dcac898c2247ee06c762814','docs/UNDERCOVERED_SYSTEMS_199.md':'2d06419d2e2152a3e2f32b6ddd4852c3349f27f2','scripts/browser-undercovered199.mjs':'69466ee52cb95cf980bff3aeca1f7ee9eec9af2f','src/forage193.js':'74bf70d6b0f970683a27cae06168c388e6093dd4','tests/helpers/husbandry199.cjs':'9954150aa9e584dd999b17b9c5de2a079042ce6a','tests/undercovered199-art.test.cjs':'1564c172bbc4e3e93266c2802351736d040bb07a','tests/undercovered199-forage.test.cjs':'4810feac72b8765bc083ec419299e551a7a99ab8','tests/undercovered199-native.test.cjs':'423a04750f838af154b2dbabe0add7842bfc33af','tests/undercovered199.test.cjs':'b657a0a91a0d9b97d3fe94213fad33c6a1f14313'}
          for path,sha in reused.items():
              p=pathlib.Path(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(get(sha))
              elements.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          subprocess.run(['git','add','--',*[e['path']for e in elements]],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='0b98387b6634e26992dd568b735242cd43da9423',tree
          out=pathlib.Path('artifacts/source200');out.mkdir(parents=True,exist_ok=True)
          receipt={'base':base,'tree':tree,'files':elements,'scope':'Exact unreferenced blobs only. No branch move, merge, deployment or claim of gameplay validation.'}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source200-exact-objects
          path: artifacts/source200/
          retention-days: 3
          if-no-files-found: error
