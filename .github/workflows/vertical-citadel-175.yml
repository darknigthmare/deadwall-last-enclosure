name: Vertical Citadel 175
on:
  push:
    branches: [feat/vertical-citadel-175]
permissions:
  contents: read
jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve exact tracked source and provenance
        run: |
          mkdir -p /tmp/vertical175
          git rev-parse HEAD > /tmp/vertical175/HEAD.txt
          git ls-tree -r HEAD > /tmp/vertical175/TREE.txt
          python3 - <<'PY'
          import subprocess, tarfile
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with tarfile.open('/tmp/vertical175/source.tar.gz','w:gz') as archive:
            for path in paths:
              if path and not path.startswith(('assets/','reports/')):
                archive.add(path, arcname=path, recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vertical175-source-${{ github.sha }}
          path: /tmp/vertical175/
          retention-days: 7
      - name: Verify extension tests when present
        run: |
          if test -f tests/vertical-citadel175.test.cjs; then node --test tests/vertical-citadel175.test.cjs; fi
          if test -f tests/vertical-citadel175.test.js; then node --test tests/vertical-citadel175.test.js; fi
      - name: Existing project checks
        run: npm run check
