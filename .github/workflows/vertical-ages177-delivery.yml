name: Citadel 177 reviewed ages and maintenance
on:
  push:
    branches: [feat/vertical-citadel-175]
    paths: ['.delivery/vertical177/**', '.github/workflows/vertical-ages177-delivery.yml']
permissions:
  contents: read
concurrency:
  group: vertical177-reviewed-delivery
  cancel-in-progress: false
jobs:
  reviewed-integration:
    if: github.repository == 'darknigthmare/deadwall-last-enclosure' && github.ref == 'refs/heads/feat/vertical-citadel-175'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact reviewed inputs and outputs
        run: python3 .delivery/vertical177/apply.py
      - name: Syntax, all 74 vertical tests and 75 core regressions
        run: |
          node scripts/check-syntax134.mjs > /tmp/vertical177-qa/syntax.log 2>&1
          node --test --test-concurrency=2 tests/vertical-citadel175.test.cjs tests/vertical-siege176.test.cjs tests/vertical-ages177.test.cjs > /tmp/vertical177-qa/vertical-tests.log 2>&1
          node --test --test-concurrency=2 tests/core.test.cjs tests/urban-night.test.cjs tests/power-grid.test.cjs > /tmp/vertical177-qa/regression.log 2>&1
          npm run build > /tmp/vertical177-qa/build.log 2>&1
      - name: Publish only verified source on PR6, never change workflows
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          branch = 'feat/vertical-citadel-175'
          remote = subprocess.check_output(['git','ls-remote','origin','refs/heads/'+branch]).decode().split()[0]
          if remote != os.environ['GITHUB_SHA']:
            raise RuntimeError('PR6 moved; refusing concurrent overwrite')
          paths = [i['path'] for i in json.load(open('.delivery/vertical177/manifest.json'))['files']]
          subprocess.run(['git','add','--',*paths],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
            subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
            subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
            subprocess.run(['git','commit','-m','feat(ages177): eleven-age vertical catalogue, finite manual guns and physical maintenance'],check=True)
            subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          pathlib.Path('/tmp/vertical177-qa/TESTED_HEAD.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD']).decode())
          PY
      - name: Install locked test prerequisites
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci > /tmp/vertical177-qa/install.log 2>&1
      - name: Native Chromium and WebGL
        run: npx playwright install --with-deps chromium > /tmp/vertical177-qa/browser-install.log 2>&1
      - name: Real classic, siege and WebGL regressions
        run: |
          node scripts/qa-vertical175.mjs > /tmp/vertical177-qa/browser175.log 2>&1
          node scripts/qa-vertical176.mjs > /tmp/vertical177-qa/browser176.log 2>&1
      - name: Eleven-age catalogue, paid manual affut and physical services
        run: node scripts/qa-vertical177.mjs > /tmp/vertical177-qa/browser177.log 2>&1
      - name: Preserve focused evidence before full project checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertical177-focused-${{ github.run_id }}
          path: |
            /tmp/vertical177-qa/
            /tmp/vertical176-qa/
            /tmp/vertical175-qa/
          retention-days: 14
      - name: Complete native project checks
        if: ${{ !cancelled() }}
        run: npm run check > /tmp/vertical177-qa/full-check.log 2>&1
      - name: Preserve complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertical177-complete-${{ github.run_id }}
          path: /tmp/vertical177-qa/
          retention-days: 14
