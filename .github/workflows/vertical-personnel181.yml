name: Vertical personnel 181 QA
on:
  push:
    branches: [feat/vertical-citadel-175]
    paths: ['src/vertical*.js', 'src/core.js', 'src/game.js', 'src/expeditions.js', 'src/salvage.js', 'tests/vertical*.cjs', 'tests/helpers/vertical*.cjs', 'scripts/qa-vertical*.mjs', 'scripts/build.mjs', 'scripts/server.mjs', 'index.html', 'sw.js', '.github/workflows/vertical-personnel181.yml']
  pull_request:
    paths: ['src/vertical*.js', 'tests/vertical*.cjs', 'scripts/qa-vertical*.mjs', '.github/workflows/vertical-personnel181.yml']
permissions:
  contents: read
concurrency:
  group: vertical181-readonly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  personnel181:
    if: github.event_name != 'pull_request' || github.head_ref != 'feat/vertical-citadel-175'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact provenance and source delta
        run: |
          mkdir -p /tmp/vertical181-qa
          git rev-parse HEAD > /tmp/vertical181-qa/TESTED_HEAD.txt
          git ls-tree -r HEAD > /tmp/vertical181-qa/TESTED_TREE.txt
          git diff --binary --full-index d874f8c5dc3777645306dedbb49d11e2b504b417 HEAD -- src tests scripts docs index.html sw.js > /tmp/vertical181-qa/PERSONNEL_181.patch
          python3 - <<'PY'
          import subprocess, tarfile
          base = 'd874f8c5dc3777645306dedbb49d11e2b504b417'
          paths = subprocess.check_output(['git','diff','--name-only','--diff-filter=AM',base,'HEAD','--','src','tests','scripts','docs','index.html','sw.js']).decode().splitlines()
          with tarfile.open('/tmp/vertical181-qa/PERSONNEL_181_sources.tar.gz','w:gz') as archive:
            for path in paths: archive.add(path, arcname=path, recursive=False)
          PY
      - name: Locked prerequisites
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci > /tmp/vertical181-qa/install.log 2>&1
      - name: Syntax and all vertical tests
        run: |
          node scripts/check-syntax134.mjs > /tmp/vertical181-qa/syntax.log 2>&1
          node --test --test-concurrency=2 tests/vertical-*.test.cjs > /tmp/vertical181-qa/vertical-tests.log 2>&1
      - name: Native core, power, urban, expeditions and cargo regression
        run: node --test --test-concurrency=2 tests/core.test.cjs tests/urban-night.test.cjs tests/power-grid.test.cjs tests/expeditions.test.cjs tests/expansion-kit.test.cjs > /tmp/vertical181-qa/regression.log 2>&1
      - name: Build and Chromium
        run: |
          npm run build > /tmp/vertical181-qa/build.log 2>&1
          npx playwright install --with-deps chromium > /tmp/vertical181-qa/browser-install.log 2>&1
      - name: Seven native browser scenarios
        env:
          DEADWALL_REQUIRE_WEBGL: '1'
        run: |
          fail=0
          for rev in 175 176 177 178 179 180 181; do
            node scripts/qa-vertical${rev}.mjs > /tmp/vertical181-qa/browser${rev}.log 2>&1 || fail=1
          done
          exit "$fail"
      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertical181-qa-${{ github.run_id }}
          path: |
            /tmp/vertical181-qa/
            /tmp/vertical180-qa/
            /tmp/vertical179-qa/
            /tmp/vertical178-qa/
            /tmp/vertical177-qa/
            /tmp/vertical176-qa/
            /tmp/vertical175-qa/
          retention-days: 14
      - name: Complete project checks
        if: ${{ !cancelled() }}
        run: npm run check > /tmp/vertical181-qa/full-check.log 2>&1
      - name: Preserve complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertical181-complete-${{ github.run_id }}
          path: /tmp/vertical181-qa/
          retention-days: 14
