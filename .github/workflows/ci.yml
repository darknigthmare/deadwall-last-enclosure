name: DEADWALL CI

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installer les dépendances de développement
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Vérification complète avec endurance
        env:
          DEADWALL_SOAK: '1'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/qa/native
          node scripts/ci-native-receipt160.mjs start --label ci-native160 --directory artifacts/qa/native
          if npm run check 2>&1 | tee artifacts/qa/native/ci-native160.log; then
            native_pipeline=("${PIPESTATUS[@]}")
          else
            native_pipeline=("${PIPESTATUS[@]}")
          fi
          check_status="${native_pipeline[0]}"
          tee_status="${native_pipeline[1]}"
          receipt_status=0
          if node scripts/ci-native-receipt160.mjs finish --label ci-native160 --directory artifacts/qa/native --exit-code "$check_status" --tee-exit-code "$tee_status"; then
            receipt_status=0
          else
            receipt_status=$?
          fi
          if [ "$check_status" -ne 0 ]; then exit "$check_status"; fi
          if [ "$tee_status" -ne 0 ]; then exit "$tee_status"; fi
          exit "$receipt_status"
      - name: Résumer les échecs natifs
        if: failure()
        run: node scripts/ci-failure-summary.mjs --directory artifacts/qa
      - name: Conserver le journal natif
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadwall-native-qa-attempt-${{ github.run_attempt }}
          path: artifacts/qa/
          if-no-files-found: warn

  browser:
    name: browser / ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - group: d17
            suites: 'test:d17'
          - group: city
            suites: 'test:city'
          - group: codex-completion
            scripts: >-
              scripts/browser-coverage167.mjs
              scripts/browser-fill168.mjs
              scripts/browser-infill169.mjs
              scripts/browser-stations170.mjs
              scripts/browser-gardens171.mjs
              scripts/browser-parallel173.mjs
          - group: codex-details
            scripts: >-
              scripts/browser-prescriptions161.mjs
              scripts/browser-sites162.mjs
              scripts/browser-quantities164.mjs
              scripts/browser-plan165.mjs
              scripts/browser-ensembles166.mjs
          - group: vertical-network
            scripts: >-
              scripts/qa-vertical179.mjs
              scripts/qa-vertical180.mjs
              scripts/qa-vertical181.mjs
          - group: vertical-early
            scripts: >-
              scripts/qa-vertical175.mjs
              scripts/qa-vertical176.mjs
              scripts/qa-vertical177.mjs
              scripts/qa-vertical178.mjs
          - group: interface
            suites: 'test:browser test:arrival test:codex test:standalone package:web'
          - group: campaign
            suites: 'test:campaign test:tactics test:reconstruction'
          - group: exploration
            suites: 'test:terrain test:journey test:visibility'
          - group: siege
            suites: 'test:assault test:preparations test:defenses test:sprites'
          - group: contexts
            suites: 'test:contexts'
          - group: touch-layout
            scripts: 'scripts/browser-touch-layout162.mjs'
          - group: metrics
            scripts: 'scripts/browser-metric174.mjs scripts/browser-metric175.mjs scripts/browser-codex162.mjs'
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      DEADWALL_REQUIRE_WEBGL: '1'
      VERTICAL175_QA_OUT: artifacts/qa/vertical175
      VERTICAL176_QA_OUT: artifacts/qa/vertical176
      VERTICAL177_QA_OUT: artifacts/qa/vertical177
      VERTICAL178_QA_OUT: artifacts/qa/vertical178
      VERTICAL179_QA_OUT: artifacts/qa/vertical179
      VERTICAL180_QA_OUT: artifacts/qa/vertical180
      VERTICAL181_QA_OUT: artifacts/qa/vertical181
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installer les dépendances de développement
        run: npm ci
      - name: Construire la version du commit testé
        run: npm run build
      - name: Installer Chromium pour les parcours réels
        run: npx playwright install --with-deps chromium
      - name: Exécuter tous les parcours du groupe
        shell: bash
        env:
          DEADWALL_CI_SUITES: ${{ matrix.suites }}
          DEADWALL_CI_SCRIPTS: ${{ matrix.scripts }}
        run: |
          mkdir -p artifacts/qa
          job_status=0
          for suite in $DEADWALL_CI_SUITES; do
            suite_status=0
            if npm run "$suite"; then
              suite_status=0
            else
              suite_status=$?
              job_status=1
            fi
            printf '%s\t%s\n' "$suite" "$suite_status" >> artifacts/qa/ci-results.tsv
          done
          for script in $DEADWALL_CI_SCRIPTS; do
            suite_status=0
            if node "$script"; then
              suite_status=0
            else
              suite_status=$?
              job_status=1
            fi
            printf '%s\t%s\n' "$script" "$suite_status" >> artifacts/qa/ci-results.tsv
          done
          exit "$job_status"
      - name: Résumer les échecs QA en annotations lisibles
        if: failure()
        run: node scripts/ci-failure-summary.mjs --directory artifacts/qa
      - name: Conserver les preuves et livrables du groupe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadwall-web-qa-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/qa/
            release/web/
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installer les outils Windows
        run: npm ci
      - name: Fabriquer le portable Windows
        run: npm run package:desktop
      - name: Vérifier deux lancements de l’archive extraite
        shell: pwsh
        run: |
          $package = Get-ChildItem release/desktop -Recurse -Filter '*-Windows-x64-portable.zip' | Select-Object -First 1
          if (-not $package) { throw 'Archive Windows introuvable.' }
          npm run test:desktop -- --archive $package.FullName --output artifacts/qa/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Résumer les échecs Windows en annotations lisibles
        if: failure()
        run: node scripts/ci-failure-summary.mjs --directory artifacts/qa/windows
      - name: Conserver le portable et ses preuves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadwall-windows-qa-attempt-${{ github.run_attempt }}
          path: |
            release/desktop/**/DEADWALL-*-Windows-x64-portable.zip
            release/desktop/**/release-manifest.json
            artifacts/qa/windows/
          if-no-files-found: warn

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [native, browser, windows]
    if: ${{ always() }}
    steps:
      - name: Vérifier les résultats de tous les jobs requis
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const results = JSON.parse(process.env.REQUIRED_JOB_RESULTS); const expected = ["native", "browser", "windows"]; const failed = expected.filter(name => results[name]?.result !== "success"); for (const name of expected) console.log(name + ": " + (results[name]?.result || "missing")); if (failed.length) process.exit(1);'
