name: DEADWALL CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérification complète
        run: npm run check
      - name: Endurance logique de deux campagnes
        env:
          DEADWALL_SOAK: '1'
        run: node --test tests/soak.test.cjs
