name: Verify exact maintenance 199 source objects
on:
  push:
    branches: [feat/undercovered-systems-199]
    paths: [.github/workflows/source199.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5fccf78b553300fc7fc1411ee339d68a6f381be3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate immutable inputs and create unreferenced source tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request,zlib
          assert os.environ['GITHUB_REPOSITORY']=='darknigthmare/deadwall-last-enclosure'
          assert os.environ['GITHUB_REF']=='refs/heads/feat/undercovered-systems-199'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='5fccf78b553300fc7fc1411ee339d68a6f381be3'
          def blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def api(path,data=None):
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
              body=None if data is None else json.dumps(data).encode()
              if body is not None:headers['Content-Type']='application/json'
              req=urllib.request.Request('https://api.github.com/repos/darknigthmare/deadwall-last-enclosure'+path,data=body,headers=headers,method='GET' if body is None else 'POST')
              with urllib.request.urlopen(req,timeout=45) as response:return json.load(response)
          parts=[]
          for sha in ['c60d322f7f775adafa1d723bd598ac6a65fd0929','099135c271c597d61474cdc34fa35450b8389f2d','c1d52d75553a003c2e4626b946c865d9fd8a19ab','cba90e7c91090cd3f4249659296cb9067dec97e9','9adfdd1200ff023c088abec05f07daa8662a1210']:
              row=api('/git/blobs/'+sha);assert row['encoding']=='base64'
              data=base64.b64decode(row['content']);assert blob(data)==sha;parts.append(data)
          encoded=b''.join(parts);assert len(encoded)==25004
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='85d8181e32e7ad2f730930ec163129476eb4141130c3b50cb49f441085a72104'
          rows=json.loads(raw)
          allowed={'.github/workflows/undercovered199.yml','docs/UNDERCOVERED_SYSTEMS_199.md','scripts/browser-undercovered199.mjs','src/core.js','src/forage193.js','src/game.js','src/husbandry191-art.js','src/husbandry191.js','tests/helpers/husbandry199.cjs','tests/undercovered199-art.test.cjs','tests/undercovered199-forage.test.cjs','tests/undercovered199-native.test.cjs','tests/undercovered199.test.cjs'}
          assert len(rows)==len(allowed) and {row['path']for row in rows}==allowed
          elements=[]
          for row in rows:
              p=pathlib.Path(row['path']);assert not p.is_symlink()
              if row['before'] is None:assert not p.exists();old=b''
              else:old=p.read_bytes();assert blob(old)==row['before']
              data=old;last=len(old)+1
              for start,end,text in reversed(row['edits']):
                  assert 0<=start<=end<=len(old) and end<last;last=start
                  data=data[:start]+text.encode()+data[end:]
              assert blob(data)==row['after'];p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              if p.suffix in ('.js','.cjs','.mjs'):subprocess.run(['node','--check',str(p)],check=True)
              created=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()});assert created['sha']==row['after']
              elements.append({'path':row['path'],'mode':'100644','type':'blob','sha':created['sha']})
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          expected='501cdacea92dfd4469988e19db3bd7c642b7b7a2'
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==expected
          tree=api('/git/trees',{'base_tree':'673d180b3f41cd474eb21184ecd58e4abdad2867','tree':elements});assert tree['sha']==expected
          out=pathlib.Path('artifacts/source199-final');out.mkdir(parents=True,exist_ok=True)
          receipt={'base':'5fccf78b553300fc7fc1411ee339d68a6f381be3','tree':tree['sha'],'files':elements,'scope':'Verified source objects only. No ref update, merge, deployment, full test or browser qualification is claimed by this workflow.'}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance199-final-source-tree
          path: artifacts/source199-final/
          retention-days: 3
          if-no-files-found: error
