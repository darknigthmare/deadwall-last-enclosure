name: DEADWALL G11 campaign sites 205
on:
  pull_request:
  push:
    branches: [main, feat/content-completion-20261024]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: campaign-sites205-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  campaign-browser:
    name: G11 campaign / actual desktop and touch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      DEADWALL_QA_ROOT: dist
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: ./.github/actions/setup-chromium
      - name: Native G11 start, guarded activation, real parcel walk, finite loot and Continue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/qa/campaign205
          node scripts/browser-campaign205.mjs 2>&1 | tee artifacts/qa/campaign205/browser.log
      - name: Installed current G11 campaign also survives offline PWA Continue
        shell: bash
        run: |
          set -euo pipefail
          DEADWALL_QA_PWA_CURRENT=1 node scripts/browser-pwa142.mjs 2>&1 | tee artifacts/qa/campaign205/pwa-current.log
      - name: Publish bounded browser failure diagnostics
        if: failure()
        run: node scripts/ci-failure-summary.mjs --directory artifacts/qa
      - name: Confirm generated runtime inputs still match the checked out source
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-sites205-proof-${{ github.run_attempt }}
          path: artifacts/qa/
          retention-days: 14
          if-no-files-found: error
