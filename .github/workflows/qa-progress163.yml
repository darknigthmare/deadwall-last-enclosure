name: DEADWALL Advanced Regression

on:
  pull_request:
    paths:
      - '.github/workflows/qa-progress163.yml'
      - 'src/**'
      - 'scripts/browser-*'
      - 'tests/qa-contracts163.test.cjs'
      - 'tests/defenses-qa148.test.cjs'
      - 'package*.json'
      - '*.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advanced-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/compile-codex3000.mjs
      - name: Exact render, version and physical fixture contracts
        run: node --test --test-concurrency=1 tests/qa-contracts163.test.cjs tests/defenses-qa148.test.cjs

  advanced:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [defenses, d17, city]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked development dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Build and install Chromium
        run: |
          npm run build
          npx playwright install --with-deps chromium
      - name: Run complete desktop and touch suite
        run: npm run test:${{ matrix.suite }}
      - name: Record exact source revision
        if: always()
        run: |
          mkdir -p artifacts/qa
          git rev-parse HEAD > artifacts/qa/source-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadwall-advanced-${{ matrix.suite }}
          path: artifacts/qa/
          retention-days: 7
          if-no-files-found: error
