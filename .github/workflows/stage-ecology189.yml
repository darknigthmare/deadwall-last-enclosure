name: Verify isolated build source correction 189
on:
  push:
    branches: [codex/transfer-ecology189-20261017]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 69cc78d5953b4f12899c7e444c3117daa2781707
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the one-line correction and create only its Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='darknigthmare/deadwall-last-enclosure'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/transfer-ecology189-20261017'
          p=pathlib.Path('tests/distribution.test.cjs')
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          before=p.read_bytes();assert blob(before)=='2c8dc2f3028e9e0629697c15c319edc259814a7f'
          old="return ['scripts/pwa-build184.cjs','scripts/public-manifest183.cjs','src/hydrology165.js'"
          new="return [...require('../scripts/public-manifest183.cjs').BUNDLED_MODULES,'scripts/pwa-build184.cjs','scripts/public-manifest183.cjs','src/hydrology165.js'"
          text=before.decode();assert text.count(old)==1;text=text.replace(old,new)
          assert blob(text.encode())=='1236130815f85b8e0b61e3ad193dd8d4e912eaf0'
          p.write_text(text)
          req=urllib.request.Request('https://api.github.com/repos/darknigthmare/deadwall-last-enclosure/git/blobs',data=json.dumps({'content':text,'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=45) as response: result=json.load(response)
          assert result['sha']==blob(text.encode());print('VERIFIED_BLOB',result['sha'])
          PY
      - name: Dependency-free real build and complete distribution tests
        run: node --test tests/distribution.test.cjs
