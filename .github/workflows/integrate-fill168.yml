name: DEADWALL one-time furniture integration
on:
  pull_request:
    paths:
      - '.github/workflows/integrate-fill168.yml'
      - 'scripts/integrate-fill168.cjs'
      - 'src/codex-fill168.js'
      - 'tests/codex-fill168.test.cjs'
permissions:
  contents: read
concurrency:
  group: deadwall-one-time-fill168
  cancel-in-progress: true
jobs:
  integrate:
    if: github.event.pull_request.number == 2 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/codex3000-detailed-programmes-159'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply only exact integration anchors
        id: patch
        run: |
          node scripts/integrate-fill168.cjs
          if git diff --quiet; then echo 'changed=false' >> "$GITHUB_OUTPUT"; else echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
      - name: Install locked test tools
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Rebuild from the authored sources
        run: npm run build
      - name: Verify new placements and every historical Codex contract
        run: |
          set -o pipefail
          mkdir -p artifacts/qa/fill168-integration
          node --test --test-concurrency=1 tests/codex*.test.cjs tests/distribution.test.cjs 2>&1 | tee artifacts/qa/fill168-integration/contracts.log
      - name: Commit tested changes to this PR only, without force
        if: steps.patch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const branch='feat/codex3000-detailed-programmes-159';
          const header='AUTHORIZATION: basic '+Buffer.from('x-access-token:'+process.env.GH_TOKEN).toString('base64');
          const git=(args,auth=false)=>execFileSync('git',[...(auth?['-c','http.https://github.com/.extraheader='+header]:[]),...args],{encoding:'utf8'}).trim();
          if(git(['rev-parse','HEAD'])!==process.env.EXPECTED)throw Error('Unexpected source revision');
          const remote=git(['ls-remote','origin','refs/heads/'+branch],true).split(/\s/)[0];
          if(remote!==process.env.EXPECTED)throw Error('PR moved concurrently; refusing publication');
          const records=JSON.parse(fs.readFileSync('artifacts/qa/fill168-integration/changed.json','utf8'));
          const changed=git(['diff','--name-only']).split('\n').filter(Boolean);
          if(changed.some(p=>!records.some(r=>r.file===p)))throw Error('Unlisted modification');
          if(!changed.length)throw Error('No integration changes');
          git(['add','--',...changed]);
          git(['-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','feat(codex): integrate tested opt-in minimum furniture completion (revision 6)']);
          git(['push','origin','HEAD:refs/heads/'+branch],true);
          fs.writeFileSync('artifacts/qa/fill168-integration/committed-revision.txt',git(['rev-parse','HEAD'])+'\n');
          console.log('Published tested integration '+git(['rev-parse','HEAD']));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadwall-fill168-integration
          path: artifacts/qa/fill168-integration/
          retention-days: 14
          if-no-files-found: warn
