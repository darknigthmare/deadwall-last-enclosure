name: Vertical ages and maintenance QA
on:
  push:
    branches: [feat/vertical-citadel-175]
    paths: ['src/vertical*.js', 'src/core.js', 'src/game.js', 'src/urban.js', 'tests/vertical*.cjs', 'scripts/qa-vertical*.mjs', '.github/workflows/vertical-maintenance178.yml']
  pull_request:
    paths: ['src/vertical*.js', 'src/core.js', 'src/game.js', 'src/urban.js', 'tests/vertical*.cjs', 'scripts/qa-vertical*.mjs', '.github/workflows/vertical-maintenance178.yml']
permissions:
  contents: read
concurrency:
  group: vertical178-readonly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record actual tested source
        run: |
          mkdir -p /tmp/vertical178-qa
          git rev-parse HEAD > /tmp/vertical178-qa/TESTED_HEAD.txt
      - name: Syntax and all vertical tests
        run: |
          node scripts/check-syntax134.mjs > /tmp/vertical178-qa/syntax.log 2>&1
          node --test --test-concurrency=2 tests/vertical-*.test.cjs > /tmp/vertical178-qa/vertical-tests.log 2>&1
      - name: Native core, urban and power regression
        run: node --test --test-concurrency=2 tests/core.test.cjs tests/urban-night.test.cjs tests/power-grid.test.cjs > /tmp/vertical178-qa/regression.log 2>&1
      - name: Install locked QA dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Native build and browser installation
        run: |
          npm run build > /tmp/vertical178-qa/build.log 2>&1
          npx playwright install --with-deps chromium
      - name: Browser 175 regression
        run: node scripts/qa-vertical175.mjs > /tmp/vertical178-qa/browser175.log 2>&1
      - name: Browser 176 regression
        if: ${{ !cancelled() }}
        run: node scripts/qa-vertical176.mjs > /tmp/vertical178-qa/browser176.log 2>&1
      - name: Browser 177 all ages and services
        if: ${{ !cancelled() }}
        run: node scripts/qa-vertical177.mjs > /tmp/vertical178-qa/browser177.log 2>&1
      - name: Browser 178 reconfiguration and structures
        if: ${{ !cancelled() }}
        run: node scripts/qa-vertical178.mjs > /tmp/vertical178-qa/browser178.log 2>&1
      - name: Preserve actual receipts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertical178-qa-${{ github.run_id }}
          path: |
            /tmp/vertical178-qa/
            /tmp/vertical177-qa/
            /tmp/vertical176-qa/
            /tmp/vertical175-qa/
          retention-days: 14
