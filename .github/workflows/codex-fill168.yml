name: DEADWALL authored furniture completion
on:
  pull_request:
    paths:
      - '.github/workflows/codex-fill168.yml'
      - 'src/codex*'
      - 'src/frontier*'
      - 'src/seed-detail*'
      - 'src/world-pack131.js'
      - 'scripts/audit-fill168.mjs'
      - 'scripts/browser-fill168.mjs'
      - 'scripts/browser-plan165.mjs'
      - 'scripts/qa-transaction167.mjs'
      - 'scripts/compile-codex3000.mjs'
      - 'tests/codex*'
      - 'tests/distribution.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: furniture-completion168-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked test tools
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Rebuild the current source revision
        run: npm run build
      - name: All Codex contracts, raster and dependency-free packaging
        run: |
          set -o pipefail
          mkdir -p artifacts/qa/fill168-contracts
          node --test --test-concurrency=1 tests/codex*.test.cjs tests/distribution.test.cjs 2>&1 | tee artifacts/qa/fill168-contracts/contracts.log
      - name: Compare all compatible recipes at every authored floor
        if: ${{ !cancelled() }}
        run: node scripts/audit-fill168.mjs
      - name: Record inspected revision and source patch
        if: always()
        run: |
          mkdir -p artifacts/qa/fill168-contracts
          git rev-parse HEAD > artifacts/qa/fill168-contracts/revision.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadwall-fill168-contracts-and-audit
          path: artifacts/qa/
          retention-days: 14
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked development tools
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Build and prepare Chromium
        run: |
          npm run build
          npx playwright install --with-deps chromium
      - name: Real optional completion, exact persisted save and recipe comparison
        run: node scripts/browser-fill168.mjs
      - name: Original recipe controls remain usable
        if: ${{ !cancelled() }}
        run: node scripts/browser-plan165.mjs
      - name: Record inspected revision
        if: always()
        run: |
          mkdir -p artifacts/qa/fill168-browser
          git rev-parse HEAD > artifacts/qa/fill168-browser/revision.txt
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for(const directory of fs.readdirSync('artifacts/qa')){
            const file='artifacts/qa/'+directory+'/report.json';if(!fs.existsSync(file))continue;
            const report=JSON.parse(fs.readFileSync(file,'utf8'));
            for(const p of report.profiles||[])console.log('BROWSER168 '+JSON.stringify({suite:directory,viewport:p.viewport,pass:p.pass,checks:p.checks?.length,failure:p.failure,transaction:p.transaction,pageErrors:p.pageErrors,consoleErrors:p.consoleErrors,httpErrors:p.httpErrors,requestFailures:p.requestFailures}));
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadwall-fill168-browser
          path: artifacts/qa/
          retention-days: 14
          if-no-files-found: error
