name: Vertical routing 180 QA
on:
  push:
    branches: [feat/vertical-citadel-175]
    paths: ['src/vertical*.js', 'src/core.js', 'src/game.js', 'src/expansion-kit.js', 'src/expeditions.js', 'src/frontier.js', 'tests/vertical*.cjs', 'tests/helpers/vertical*.cjs', 'scripts/qa-vertical*.mjs', 'sw.js', '.github/workflows/vertical-network180.yml']
  pull_request:
    paths: ['src/vertical*.js', 'tests/vertical*.cjs', 'tests/helpers/vertical*.cjs', 'scripts/qa-vertical*.mjs', 'sw.js', '.github/workflows/vertical-network180.yml']
permissions:
  contents: read
concurrency:
  group: vertical180-${{ github.ref }}
  cancel-in-progress: true
jobs:
  network180:
    if: github.event_name != 'pull_request' || github.head_ref != 'feat/vertical-citadel-175'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact provenance and cumulative reviewed source
        run: |
          mkdir -p /tmp/vertical180-qa
          git rev-parse HEAD > /tmp/vertical180-qa/TESTED_HEAD.txt
          git ls-tree -r HEAD > /tmp/vertical180-qa/TESTED_TREE.txt
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          r = pathlib.Path('/tmp/vertical180-qa')
          base = 'd0fffbc03b4ad4b3baaa7f073bc3f739bb84abc3'
          paths = [p for p in subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines() if not p.startswith('.')]
          (r/'CUMULATIVE_BASE.txt').write_text(base+'\n')
          (r/'CUMULATIVE_179_180.patch').write_bytes(subprocess.check_output(['git','diff','--binary',base,'HEAD','--',*paths]))
          with tarfile.open(r/'CUMULATIVE_179_180_sources.tar.gz','w:gz') as out:
              for p in paths:
                  if pathlib.Path(p).is_file(): out.add(p,arcname=p,recursive=False)
          PY
      - name: Install locked prerequisites
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Syntax and all vertical tests
        run: |
          node scripts/check-syntax134.mjs > /tmp/vertical180-qa/syntax.log 2>&1
          node --test --test-concurrency=2 tests/vertical-*.test.cjs > /tmp/vertical180-qa/vertical-tests.log 2>&1
      - name: Native core, power, urban, expeditions and cargo regression
        run: node --test --test-concurrency=2 tests/core.test.cjs tests/urban-night.test.cjs tests/power-grid.test.cjs tests/expeditions.test.cjs tests/expansion-kit.test.cjs > /tmp/vertical180-qa/regression.log 2>&1
      - name: Native build and Chromium
        run: |
          npm run build > /tmp/vertical180-qa/build.log 2>&1
          npx playwright install --with-deps chromium
      - name: Six native browser scenarios
        run: |
          fail=0
          for rev in 175 176 177 178 179 180; do
            node scripts/qa-vertical${rev}.mjs > /tmp/vertical180-qa/browser${rev}.log 2>&1 || fail=1
          done
          exit "$fail"
      - name: Preserve focused evidence and cumulative source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertical180-qa-${{ github.run_id }}
          path: /tmp/vertical*-qa/
          retention-days: 14
      - name: Complete project checks
        if: ${{ !cancelled() }}
        run: npm run check > /tmp/vertical180-qa/full-check.log 2>&1
      - name: Complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertical180-complete-${{ github.run_id }}
          path: /tmp/vertical180-qa/
          retention-days: 14
