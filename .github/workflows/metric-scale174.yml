name: DEADWALL metric scale and road access
on:
  push:
    branches: ['fix/metric-scale-road-access-174']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metric-scale174-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Archive exact tracked development inputs
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, hashlib, json, zipfile
          root=pathlib.Path.cwd()
          out=root/'artifacts/metric174'
          out.mkdir(parents=True,exist_ok=True)
          revision=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          records=[]
          permitted={'src','tests','scripts','assets','docs','desktop','codex-3000','.github'}
          with zipfile.ZipFile(out/'source.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=3) as z:
              for name in sorted(filter(None,subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))):
                  p=pathlib.PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts: raise ValueError('Unsafe source path')
                  if len(p.parts)>1 and p.parts[0] not in permitted and name!='reports/1.35.0/legacy-g5-start-save.json': continue
                  if any(s.startswith('.env') for s in p.parts) or p.suffix.lower() in {'.ttf','.otf','.woff','.woff2','.pem','.key','.p12'}: continue
                  f=root/name
                  if not f.is_file() or f.is_symlink(): continue
                  data=f.read_bytes()
                  z.writestr(name,data)
                  records.append({'path':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              z.writestr('SOURCE-MANIFEST174.json',json.dumps({'revision':revision,'files':records},ensure_ascii=False))
          print(revision, len(records), 'tracked files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deadwall-metric174-source
          path: artifacts/metric174/source.zip
          retention-days: 7
      - name: Install locked development dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Build and run available metric contracts
        run: |
          npm run build
          if [ -f tests/metric-scale174.test.cjs ]; then node --test --test-concurrency=1 tests/metric-scale174.test.cjs; fi
          if [ -f tests/road-access174.test.cjs ]; then node --test --test-concurrency=1 tests/road-access174.test.cjs; fi
          if [ -f scripts/audit-metric174.mjs ]; then node scripts/audit-metric174.mjs; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadwall-metric174-evidence
          path: artifacts/qa/metric174/
          if-no-files-found: ignore
          retention-days: 14
