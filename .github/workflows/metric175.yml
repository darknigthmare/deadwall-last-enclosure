name: DEADWALL rigid bodies and strict frontage
on:
  push:
    branches: [fix/metric-scale-road-access-174]
  pull_request:
    paths:
      - 'src/*174.js'
      - 'src/core.js'
      - 'src/tactics.js'
      - 'src/expeditions.js'
      - 'src/exploration-125.js'
      - 'src/fieldcraft.js'
      - 'src/barricades134.js'
      - 'src/frontier*'
      - 'scripts/*175*'
      - 'scripts/audit-metric174.mjs'
      - 'scripts/metric174-world-probe.cjs'
      - 'scripts/metric-compat185.cjs'
      - 'tests/*175*'
      - '.github/workflows/metric175.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metric175-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - name: Record provenance and exact ownership contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/qa/metric175
          git rev-parse HEAD > artifacts/qa/metric175/tested-revision.txt
          git rev-parse HEAD:src > artifacts/qa/metric175/tested-src-tree.txt
          node --test --test-concurrency=2 tests/metric-body175.test.cjs tests/metric-corridor175.test.cjs tests/frontage-followup175.test.cjs tests/metric174.test.cjs tests/frontage174.test.cjs tests/metric-migration174.test.cjs tests/expeditions.test.cjs tests/vehicle-boundary151.test.cjs tests/tactics.test.cjs tests/fieldcraft.test.cjs tests/fieldcraft-restore146.test.cjs tests/distribution.test.cjs | tee artifacts/qa/metric175/contracts.log
      - name: Inventory and independent historical fingerprints
        run: |
          mkdir -p /tmp/metric175-main /tmp/metric175-current
          git archive 5b8f0ade7f7e93d3fc3ea23f762cac93ded43d90 src | tar -x -C /tmp/metric175-main
          git archive 1314e2c1d67f23c05cdd4bd53943fe97c6f56d9a src | tar -x -C /tmp/metric175-current
          node scripts/audit-metric174.mjs --baseline /tmp/metric175-main --strict-baseline /tmp/metric175-current --legacy-visual-additions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadwall-metric175-contracts
          path: artifacts/qa/
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Real controls and exact saved parking recovery
        run: node scripts/browser-metric175.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadwall-metric175-browser
          path: artifacts/qa/
          retention-days: 14
