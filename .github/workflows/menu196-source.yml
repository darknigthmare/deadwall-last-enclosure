name: Menu 196 verified lifecycle refinement
on:
  push:
    branches: [codex/menu196-source-20261019]
    paths: [.github/workflows/menu196-source.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 76450f62348688689d219eb89a3b248b7fe5ca41
          persist-credentials: false
      - name: Verify all bytes and create an unreferenced refinement tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request,zlib
          assert os.environ['GITHUB_REPOSITORY']=='darknigthmare/deadwall-last-enclosure'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/menu196-source-20261019'
          def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def api(path,data=None):
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
              body=None if data is None else json.dumps(data).encode()
              if body is not None:headers['Content-Type']='application/json'
              request=urllib.request.Request('https://api.github.com/repos/darknigthmare/deadwall-last-enclosure'+path,data=body,headers=headers,method='GET' if data is None else 'POST')
              with urllib.request.urlopen(request,timeout=45) as response:return json.load(response)
          encoded=''
          payload=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(payload).hexdigest()=='4a596ea18c9fcba35a2dfdade57363be49b8324442c412ddf070bf0a7fca8491'
          entries=json.loads(payload);assert {e['path']for e in entries}=={'src/player-menus194.js','tests/player-menus194.test.cjs','tests/city-content150.test.cjs','docs/PLAYER_MENUS_196.md'}
          elements=[]
          for entry in entries:
              row=api('/git/blobs/'+entry['before']);assert row['encoding']=='base64'
              original=base64.b64decode(row['content']);assert blob(original)==entry['before'];data=original
              for start,end,text in reversed(entry['edits']):
                  assert 0<=start<=end<=len(original);data=data[:start]+text.encode()+data[end:]
              assert blob(data)==entry['after']
              p=pathlib.Path(entry['path']);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              if p.suffix in ('.js','.cjs','.mjs'):subprocess.run(['node','--check',str(p)],check=True)
              created=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()});assert created['sha']==entry['after']
              elements.append({'path':entry['path'],'mode':'100644','type':'blob','sha':entry['after']})
          tree=api('/git/trees',{'base_tree':'df2d15033eacba6cf2058b2d89a9169c49992c6f','tree':elements})
          assert tree['sha']=='c2d8ea1145090765578e7661b5ccf16e939df715'
          out=pathlib.Path('artifacts/menu196-refinement');out.mkdir(parents=True,exist_ok=True)
          receipt={'base':'76450f62348688689d219eb89a3b248b7fe5ca41','tree':tree['sha'],'files':elements,'scope':'Verified unreferenced objects; no branch update, merge, deployment, or test-pass claim.'}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: menu196-refined-tree
          path: artifacts/menu196-refinement/
          retention-days: 3
          if-no-files-found: error
