name: Verify optional notebook interface hooks
on:
  push:
    branches: [codex/menu196-source-20261019]
    paths: [.github/workflows/menu196-source.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify three optional calls and create an unreferenced source tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='darknigthmare/deadwall-last-enclosure'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/menu196-source-20261019'
          def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def api(path,data=None):
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
              body=None if data is None else json.dumps(data).encode()
              if body is not None:headers['Content-Type']='application/json'
              req=urllib.request.Request('https://api.github.com/repos/darknigthmare/deadwall-last-enclosure'+path,data=body,headers=headers,method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req,timeout=45) as response:return json.load(response)
          row=api('/git/blobs/b5d783fe667d3f58949a71ce9220f420f5eed834');assert row['encoding']=='base64'
          data=base64.b64decode(row['content']);assert blob(data)=='b5d783fe667d3f58949a71ce9220f420f5eed834'
          for old,new in [(b'game.playerMenus194?.leaveMaintenance();',b'game.playerMenus194?.leaveMaintenance?.();'),(b'game.expansionUI?.refresh(presentationForce===true);',b'game.expansionUI?.refresh?.(presentationForce===true);'),(b'game.playerMenus194?.refresh();',b'game.playerMenus194?.refresh?.();')]:
              assert data.count(old)==1;data=data.replace(old,new)
          assert blob(data)=='8026bbb53a2022cad54ae6492171e9caeeddc41a'
          pathlib.Path('command-ui.js').write_bytes(data);subprocess.run(['node','--check','command-ui.js'],check=True)
          created=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()});assert created['sha']=='8026bbb53a2022cad54ae6492171e9caeeddc41a'
          tree=api('/git/trees',{'base_tree':'f8bebe78ed910484c80da5e827dd8d7f51833dbf','tree':[{'path':'src/command-ui.js','mode':'100644','type':'blob','sha':created['sha']}]});assert tree['sha']=='673d180b3f41cd474eb21184ecd58e4abdad2867'
          out=pathlib.Path('receipt');out.mkdir()
          (out/'receipt.json').write_text(json.dumps({'base':'5632f1b70f8ed748f009726648d16b81941720f0','tree':tree['sha'],'scope':'Verified source objects only. No ref change, merge, deployment or test-pass claim.'},indent=2)+'\n')
          print(tree['sha'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: menu196-first-entry-final-tree
          path: receipt/
          retention-days: 3
          if-no-files-found: error
