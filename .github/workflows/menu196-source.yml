name: Verify notebook first-entry correction
on:
  push:
    branches: [codex/menu196-source-20261019]
    paths: [.github/workflows/menu196-source.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5632f1b70f8ed748f009726648d16b81941720f0
          persist-credentials: false
      - name: Verify exact sources and create unreferenced Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request,zlib
          assert os.environ['GITHUB_REPOSITORY']=='darknigthmare/deadwall-last-enclosure'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/menu196-source-20261019'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='5632f1b70f8ed748f009726648d16b81941720f0'
          def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def api(path,data):
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
              req=urllib.request.Request('https://api.github.com/repos/darknigthmare/deadwall-last-enclosure'+path,data=json.dumps(data).encode(),headers=headers,method='POST')
              with urllib.request.urlopen(req,timeout=45) as response:return json.load(response)
          encoded=''
          payload=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(payload).hexdigest()=='c8433c1b6e985ed5474039d95d7eb603484698fed8d428cc6871a70b0c32bd77'
          entries=json.loads(payload);assert {e['path']for e in entries}=={'src/command-ui.js','src/player-menus194.js','tests/player-menus194.test.cjs','docs/PLAYER_MENUS_196.md'}
          elements=[]
          for e in entries:
              p=pathlib.Path(e['path']);original=p.read_bytes();assert blob(original)==e['before'];data=original
              for start,end,text in reversed(e['edits']):
                  assert 0<=start<=end<=len(original);data=data[:start]+text.encode()+data[end:]
              assert blob(data)==e['after'];p.write_bytes(data)
              if p.suffix in ('.js','.cjs','.mjs'):subprocess.run(['node','--check',str(p)],check=True)
              created=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()});assert created['sha']==e['after']
              elements.append({'path':e['path'],'mode':'100644','type':'blob','sha':e['after']})
          subprocess.run(['git','diff','--check'],check=True)
          tree=api('/git/trees',{'base_tree':'c07c43016e77e087a984b14aeb6d941f8f97bcdc','tree':elements});assert tree['sha']=='f8bebe78ed910484c80da5e827dd8d7f51833dbf'
          out=pathlib.Path('artifacts/menu196-first-entry');out.mkdir(parents=True,exist_ok=True)
          receipt={'base':'5632f1b70f8ed748f009726648d16b81941720f0','tree':tree['sha'],'files':elements,'scope':'Exact source objects only; no ref update, merge, deployment or claim of gameplay validation.'}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: menu196-first-entry-tree
          path: artifacts/menu196-first-entry/
          retention-days: 3
          if-no-files-found: error
