name: DEADWALL Codex review

on:
  pull_request:
    paths:
      - '.github/workflows/codex-review163.yml'
      - 'hud135.css'
      - 'src/codex*'
      - 'src/frontier*'
      - 'src/world-codex*'
      - 'src/world-pack*'
      - 'scripts/compile-codex*'
      - 'scripts/browser-*'
      - 'tests/codex*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify dependency-free build
        run: npm run build
      - name: Archive tracked development sources with fingerprints
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, stat, subprocess, zipfile
          root = pathlib.Path.cwd()
          output = root / 'artifacts' / 'codex-review163'
          output.mkdir(parents=True, exist_ok=True)
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          allowed = {'src', 'tests', 'scripts', 'assets', 'docs', 'desktop', 'codex-3000', '.github'}
          denied_suffixes = {'.pem', '.key', '.p12', '.ttf', '.otf', '.woff', '.woff2'}
          records = []
          archive = output / ('DEADWALL-sources-' + commit[:12] + '.zip')
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as bundle:
              for name in sorted(filter(None, names)):
                  relative = pathlib.PurePosixPath(name)
                  if relative.is_absolute() or '..' in relative.parts:
                      raise ValueError('Unsafe tracked path')
                  if len(relative.parts) > 1 and relative.parts[0] not in allowed:
                      continue
                  if any(part.startswith('.env') for part in relative.parts) or relative.suffix.lower() in denied_suffixes:
                      continue
                  source = root / name
                  if not stat.S_ISREG(source.lstat().st_mode):
                      continue
                  data = source.read_bytes()
                  records.append({'path': name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
                  bundle.writestr(name, data)
              manifest = {'revision': commit, 'scope': 'Tracked development inputs only; no credentials, installed dependencies or player saves.', 'files': records}
              bundle.writestr('SOURCE-MANIFEST163.json', json.dumps(manifest, ensure_ascii=False, indent=2))
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (output / 'SHA256SUMS.txt').write_text(digest + '  ' + archive.name + '\n')
          print(json.dumps({'revision': commit, 'files': len(records), 'archiveBytes': archive.stat().st_size, 'sha256': digest}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deadwall-development-source
          path: artifacts/codex-review163/
          retention-days: 7
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install development dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Build and install Chromium
        run: |
          npm run build
          npx playwright install --with-deps chromium
      - name: Real browser and offline regression
        run: npm run test:browser
      - name: Codex source and furnishing contracts
        if: ${{ !cancelled() }}
        run: node scripts/browser-prescriptions161.mjs && node scripts/browser-sites162.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadwall-codex-fast-qa
          path: artifacts/qa/
          retention-days: 7
          if-no-files-found: warn
