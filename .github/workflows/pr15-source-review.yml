name: Merged 1.69 exact source receipt
on:
  push:
    branches: [codex/pr15-review-20261021]
    paths: [.github/workflows/pr15-source-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 74a62084e96dd7e78463bd4e15b9ec2897887704
          persist-credentials: false
      - name: Archive exact tracked source and metadata
        run: |
          set -euo pipefail
          mkdir -p /tmp/main169
          git archive --format=tar HEAD -- . ':!assets' | gzip > /tmp/main169/sources.tar.gz
          git archive --format=tar HEAD -- 'assets/*.json' 'assets/**/*.json' | gzip > /tmp/main169/asset-metadata.tar.gz
          git ls-tree -r -z HEAD > /tmp/main169/tree.bin
          git rev-parse HEAD > /tmp/main169/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: main169-source-74a6208
          path: /tmp/main169/
          retention-days: 7
          if-no-files-found: error
