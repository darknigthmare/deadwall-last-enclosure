name: Stage audited corrections

on:
  push:
    branches: ['codex/audit-fixes-2026-10-16']

permissions:
  contents: write

jobs:
  stage:
    if: github.event.head_commit.message == 'Stage audited corrections as verified Git objects'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      DEADWALL_QA_ROOT: ${{ github.workspace }}/dist
      VERTICAL175_QA_OUT: ${{ github.workspace }}/artifacts/qa/audit183-vertical
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Materialize the reviewed patch and stage Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, base64, gzip, hashlib, subprocess, urllib.request, pathlib
          repo='darknigthmare/deadwall-last-enclosure'
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/codex/audit-fixes-2026-10-16'
          expected='7b5549cd31ebceb6cc1601eedf6c462a39dd0e91'
          parent=subprocess.check_output(['git','rev-parse','HEAD^']).decode().strip()
          assert parent==expected, (parent,expected)
          base='https://api.github.com/repos/'+repo
          def api(route,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(base+route,data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
          blobs=['e80c51d4dd1e56be5df4598322629d63699d865a','c050df301c7b0f5ad8a9d5f5044265bd14f08fb5','3975ed94e1d67c6a2275e44ed6b31e796163a738','417ff539cf3d3170af4aaad1949fae044ab6f455']
          packed=b''.join(base64.b64decode(api('/git/blobs/'+sha)['content']) for sha in blobs)
          digest=hashlib.sha256(packed).hexdigest()
          assert digest=='7f7a3d2bf70bf269c1bc98bee0283bae5caa9e6be618a557205bd9915d71615b'
          patch=gzip.decompress(packed)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          staging='.github/workflows/audit-stage183.yml'
          subprocess.run(['git','rm',staging],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().strip('\0').split('\0')
          assert len(changed)==23,changed
          entries=[]; hashes={}
          for name in changed:
              p=pathlib.Path(name)
              if name==staging:
                  entries.append({'path':name,'mode':'100644','type':'blob','sha':None}); continue
              data=p.read_bytes()
              sha=api('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha']
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert sha==expected,name
              hashes[name]=hashlib.sha256(data).hexdigest()
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          base_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip()
          tree=api('/git/trees',{'base_tree':base_tree,'tree':entries})['sha']
          output=pathlib.Path('artifacts/audit-candidate183');output.mkdir(parents=True)
          receipt={'parent':os.environ['GITHUB_SHA'],'tree':tree,'patchGzipSHA256':digest,'files':hashes,'entries':entries,'scope':'Git objects only. No commit, ref update, merge or deployment performed by this workflow.'}
          (output/'tree.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps({'parent':receipt['parent'],'tree':tree,'changed':len(changed)}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: audit-candidate183-tree
          path: artifacts/audit-candidate183/tree.json
          if-no-files-found: error
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/audit183-manifest.test.cjs tests/audit183-render.test.cjs tests/audit183-ui.test.cjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Native campaign from candidate distribution
        run: node scripts/browser-audit183.mjs
      - name: FPS, tactile controls and geometry cache from candidate distribution
        if: success() || failure()
        run: node scripts/qa-vertical175.mjs
      - name: Record candidate identity
        if: always()
        run: |
          mkdir -p artifacts/qa
          cp artifacts/audit-candidate183/tree.json artifacts/qa/candidate-tree.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-candidate183-proof
          path: artifacts/qa/
          retention-days: 7
