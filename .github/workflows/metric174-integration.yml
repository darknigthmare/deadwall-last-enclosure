name: DEADWALL metric174 guarded integration
on:
  push:
    branches: [fix/metric174-scale-frontage]
    paths: ['scripts/metric174-payload.*.gzpart', 'scripts/metric174-integrate.py', '.github/workflows/metric174-integration.yml']
permissions:
  contents: write
concurrency:
  group: metric174-source-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify original and result source fingerprints
        run: python3 scripts/metric174-integrate.py apply
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - name: Metrics, frontage, migration, heritage and distribution contracts
        run: |
          set -o pipefail
          mkdir -p artifacts/qa/metric174
          node --test --test-concurrency=2 tests/metric174.test.cjs tests/frontage174.test.cjs tests/metric-migration174.test.cjs tests/expeditions.test.cjs tests/vehicle-boundary151.test.cjs tests/vehicle-art152.test.cjs tests/world-variants158.test.cjs tests/road-network129.test.cjs tests/driveway-surface144.test.cjs tests/distribution.test.cjs | tee artifacts/qa/metric174/contracts-ci.log
      - name: All programme definitions and exact historic world fingerprints
        run: |
          mkdir -p /tmp/metric174-reference
          git archive 5b8f0ade7f7e93d3fc3ea23f762cac93ded43d90 src | tar -x -C /tmp/metric174-reference
          node scripts/audit-metric174.mjs --baseline /tmp/metric174-reference
      - name: Install Chromium and execute trusted campaign controls
        run: |
          npx playwright install --with-deps chromium
          node scripts/browser-metric174.mjs
      - name: Publish only verified source files to unchanged feature branch
        run: python3 scripts/metric174-integrate.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadwall-metric174-integration
          path: artifacts/qa/
          retention-days: 14
