name: Install and verify locked Chromium
description: Restore and download locked Chromium, install system libraries only after a failed launch, then verify again.
runs:
  using: composite
  steps:
    - name: Restore the locked Playwright browser
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
    - name: Download the locked Chromium with one bounded retry
      shell: bash
      env:
        PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '15000'
      run: |
        for attempt in 1 2; do
          echo "Chromium installation attempt $attempt/2"
          if timeout --kill-after=10s 120s node node_modules/playwright/cli.js install chromium; then
            exit 0
          fi
          if [ "$attempt" = 2 ]; then
            echo '::error::Locked Chromium could not be installed within two bounded attempts.'
            exit 1
          fi
        done
    - name: Check whether locked Chromium already launches
      id: chromium_probe
      shell: bash
      run: |
        if timeout --kill-after=5s 45s node --input-type=module <<'JS'
        import {chromium} from 'playwright';
        try {
          let browser;
          try {
            browser = await chromium.launch({headless:true});
            console.log('Verified Chromium ' + browser.version());
          } finally { await browser?.close(); }
        } catch {
          console.error('Locked Chromium launch or close verification failed.');
          process.exitCode = 1;
        }
        JS
        then
          echo 'needs_deps=false' >> "$GITHUB_OUTPUT"
        else
          echo 'needs_deps=true' >> "$GITHUB_OUTPUT"
          echo '::warning::Locked Chromium did not launch cleanly; trying bounded system dependency installation.'
        fi
    - name: Install Chromium system libraries only when required
      if: ${{ steps.chromium_probe.outputs.needs_deps == 'true' }}
      shell: bash
      run: |
        # Two 290-second attempts plus their 10-second termination grace total at most ten minutes.
        for attempt in 1 2; do
          echo "Chromium system dependency attempt $attempt/2"
          if timeout --kill-after=10s 290s node node_modules/playwright/cli.js install-deps chromium; then
            exit 0
          else
            installer_status=$?
          fi
          echo "::warning::System dependency attempt $attempt exited $installer_status."
          if [ "$attempt" = 2 ]; then
            echo '::error::Chromium system dependencies failed after two bounded attempts.'
            exit "$installer_status"
          fi
        done
    - name: Verify the installed browser actually launches
      if: ${{ always() }}
      shell: bash
      run: |
        timeout --kill-after=5s 45s node --input-type=module <<'JS'
        import {chromium} from 'playwright';
        try {
          let browser;
          try {
            browser = await chromium.launch({headless:true});
            console.log('Verified Chromium ' + browser.version());
          } finally { await browser?.close(); }
        } catch {
          console.error('Locked Chromium launch or close verification failed.');
          process.exitCode = 1;
        }
        JS
