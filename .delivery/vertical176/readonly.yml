name: Citadel 176 QA
on:
  push:
    branches: [feat/vertical-citadel-175]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: vertical176-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  targeted-and-browser:
    if: github.event_name != 'pull_request' || github.head_ref == 'feat/vertical-citadel-175'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact source and focused tests
        run: |
          mkdir -p /tmp/vertical176-qa
          git rev-parse HEAD > /tmp/vertical176-qa/TESTED_HEAD.txt
          node scripts/check-syntax134.mjs > /tmp/vertical176-qa/syntax.log 2>&1
          node --test --test-concurrency=2 tests/vertical-citadel175.test.cjs tests/vertical-siege176.test.cjs > /tmp/vertical176-qa/tests.log 2>&1
      - name: Locked dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Native build and Chromium
        run: |
          npm run build > /tmp/vertical176-qa/build.log 2>&1
          npx playwright install --with-deps chromium
      - name: Actual UI, classic and WebGL regression
        run: |
          node scripts/qa-vertical175.mjs > /tmp/vertical176-qa/browser175.log 2>&1
          node scripts/qa-vertical176.mjs > /tmp/vertical176-qa/browser176.log 2>&1
      - name: Preserve focused receipts before full checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertical176-focused-${{ github.run_id }}
          path: |
            /tmp/vertical176-qa/
            /tmp/vertical175-qa/
          retention-days: 14
      - name: Full project checks
        if: ${{ !cancelled() }}
        run: npm run check > /tmp/vertical176-qa/full-check.log 2>&1
      - name: Preserve complete receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertical176-complete-${{ github.run_id }}
          path: /tmp/vertical176-qa/
          retention-days: 14
